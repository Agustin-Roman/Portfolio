<!doctype html>
<html lang="en">
<head>
    <title>Test1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="test2.css">
</head>

<body>
    <header></header>

    <main id="contenedor" > 
        <div class="carrusel border-bottom border-success border-2" id="carr1">
            <div class="item-carrusel" id="c1">
                A
            </div>
            <div class="arrows">
                <a href="#carr3" class="arrow-left">
                    <i class="bi bi-arrow-left-short"></i>
                </a>
                <a href="#carr2" class="arrow-right">
                    <i class="bi bi-arrow-right-short"></i>
                </a>
            </div>
        </div>

        <div class="carrusel" id="carr2">
            <div class="item-carrusel" id="c2">
                B
            </div>
            <div class="arrows">
                <a href="#carr1" class="arrow-left">
                    <i>&lt;</i>
                </a>
                <a href="#carr3" class="arrow-right">
                    <i>&gt;</i>
                </a>
            </div>
        </div>

        <div class="carrusel" id="carr3">
            <div class="item-carrusel" id="c3">
                C
            </div>
            <div class="arrows">
                <a href="#carr2" class="arrow-left">
                    <i>&lt;</i>
                </a>
                <a href="#carr1" class="arrow-right">
                    <i>&gt;</i>
                </a>
            </div>
        </div>

    </main>

    <section class="container mt-5">
        <div id="carruselBootstrap" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-center align-items-center bg-primary text-white" style="height:200px;">
                        Slide 1
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center align-items-center bg-success text-white" style="height:200px;">
                        Slide 2
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center align-items-center bg-warning text-dark" style="height:200px;">
                        Slide 3
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carruselBootstrap" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselBootstrap" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </section>

    <footer></footer>

    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"
    ></script>
</body>
</html>
