    <!-- Modal solo img (Lightbox) -->
    <div class="modal fade" id="certModal" tabindex="-1" data-bs-backdrop="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0 shadow-none">
                
                <!-- Botón de cerrar -->
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" 
                        data-bs-dismiss="modal" style="z-index: 10; filter: drop-shadow(0 0 4px black);"></button>
                
                <div class="modal-body p-0 text-center">
                    <img id="modalImage" class="modal-img" alt="">
                </div>
            </div>
        </div>
    </div>
